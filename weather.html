<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DriveMap - GPS 2D</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
}

html,body,#map{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#101828;
    overflow:hidden;
}

#map{
    position:fixed;
    inset:0;
}

.panel{
    position:fixed;
    z-index:1000;
    left:12px;
    right:12px;
    top:12px;
    background:rgba(15,23,42,.95);
    color:white;
    border:1px solid #334155;
    border-radius:16px;
    padding:12px;
    box-shadow:0 8px 30px #0006;
    backdrop-filter:blur(8px);
}

.search{
    display:flex;
    gap:7px;
}

input{
    flex:1;
    min-width:0;
    padding:12px;
    border-radius:11px;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
    font-size:15px;
}

button{
    border:0;
    border-radius:11px;
    padding:11px 13px;
    background:#2563eb;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

button.secondary{
    background:#334155;
}

button.green{
    background:#059669;
}

.row{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.row button{
    flex:1;
}

#info{
    position:fixed;
    z-index:1000;
    bottom:14px;
    left:12px;
    right:12px;
    background:rgba(15,23,42,.95);
    color:white;
    border:1px solid #334155;
    border-radius:17px;
    padding:14px;
    box-shadow:0 8px 30px #0006;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:#1e293b;
    border-radius:11px;
    padding:9px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:18px;
    margin-top:3px;
}

.small{
    color:#a8b5c8;
    font-size:12px;
}

#status{
    margin-top:9px;
    color:#cbd5e1;
    font-size:13px;
}

.vehicle{
    width:22px;
    height:22px;
    border-radius:50% 50% 50% 0;
    background:#2563eb;
    transform:rotate(-45deg);
    border:3px solid white;
    box-shadow:0 2px 8px #0008;
}

.vehicle span{
    display:block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:white;
    margin:4px;
}

@media(max-width:600px){

    .panel{
        top:8px;
        left:8px;
        right:8px;
    }

    #info{
        left:8px;
        right:8px;
        bottom:8px;
    }

    button{
        padding:11px 8px;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">

    <div class="search">

        <input
            id="destination"
            placeholder="اكتب الوجهة: باريس، شارع..."
        >

        <button onclick="searchDestination()">
            بحث
        </button>

    </div>

    <div class="row">

        <button
            class="green"
            onclick="startGPS()"
        >
            📍 موقعي
        </button>

        <button
            onclick="startNavigation()"
        >
            🚗 ابدأ القيادة
        </button>

        <button
            class="secondary"
            onclick="stopNavigation()"
        >
            ⏹ إيقاف
        </button>

    </div>

</div>


<div id="info">

    <div class="stats">

        <div class="stat">
            <span class="small">
                السرعة
            </span>

            <b id="speed">
                0 كم/س
            </b>
        </div>


        <div class="stat">

            <span class="small">
                المسافة
            </span>

            <b id="distance">
                --
            </b>

        </div>


        <div class="stat">

            <span class="small">
                الوصول
            </span>

            <b id="eta">
                --
            </b>

        </div>

    </div>


    <div id="status">
        📍 اضغط «موقعي» للسماح بتحديد موقعك.
    </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ================================
   الخريطة
================================ */

const map = L.map("map", {
    zoomControl:false
}).setView(
    [36.8065,10.1815],
    6
);


L.control.zoom({
    position:"bottomright"
}).addTo(map);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "© OpenStreetMap contributors",
        maxZoom:19
    }
).addTo(map);


/* ================================
   المتغيرات
================================ */

let watchId = null;

let userMarker = null;

let destinationMarker = null;

let routeLine = null;

let userPos = null;

let destination = null;

let navigating = false;

let lastRoute = 0;


/* ================================
   أدوات
================================ */

function setStatus(text){

    document.getElementById(
        "status"
    ).textContent = text;

}


function km(meters){

    if(meters < 1000){

        return Math.round(meters) + " م";

    }

    return (
        meters / 1000
    ).toFixed(
        meters < 10000 ? 1 : 0
    ) + " كم";

}


function formatTime(seconds){

    const minutes =
        Math.max(
            1,
            Math.round(seconds / 60)
        );


    if(minutes < 60){

        return minutes + " د";

    }


    const hours =
        Math.floor(minutes / 60);


    const mins =
        minutes % 60;


    return (
        hours +
        " س " +
        (
            mins
                ? mins + " د"
                : ""
        )
    );

}


/* ================================
   علامة السيارة
================================ */

function updateVehicle(
    lat,
    lon
){

    const icon =
        L.divIcon({

            className:"",

            html:
                '<div class="vehicle">' +
                '<span></span>' +
                '</div>',

            iconSize:[
                22,
                22
            ],

            iconAnchor:[
                11,
                20
            ]

        });


    if(!userMarker){

        userMarker =
            L.marker(
                [lat,lon],
                {icon}
            )
            .addTo(map);

    }

    else{

        userMarker.setLatLng(
            [lat,lon]
        );

    }

}


/* ================================
   GPS
================================ */

function startGPS(){

    if(!navigator.geolocation){

        setStatus(
            "❌ جهازك لا يدعم GPS"
        );

        return;

    }


    setStatus(
        "📡 جارٍ تحديد موقعك..."
    );


    if(watchId !== null){

        navigator.geolocation
            .clearWatch(
                watchId
            );

    }


    watchId =
        navigator.geolocation.watchPosition(
            onPosition,
            onGPSerror,
            {
                enableHighAccuracy:true,
                maximumAge:3000,
                timeout:15000
            }
        );

}


/* ================================
   تحديث الموقع
================================ */

function onPosition(position){

    userPos = {

        lat:
            position.coords.latitude,

        lon:
            position.coords.longitude

    };


    updateVehicle(
        userPos.lat,
        userPos.lon
    );


    let speed = 0;


    if(
        Number.isFinite(
            position.coords.speed
        ) &&
        position.coords.speed >= 0
    ){

        speed =
            position.coords.speed * 3.6;

    }


    document.getElementById(
        "speed"
    ).textContent =
        Math.round(speed) +
        " كم/س";


    if(!navigating){

        map.setView(
            [
                userPos.lat,
                userPos.lon
            ],
            16
        );

    }


    setStatus(
        navigating
            ? "🚗 وضع القيادة يعمل"
            : "🟢 GPS متصل"
    );


    if(
        navigating &&
        destination
    ){

        updateNavigation();

    }

}


/* ================================
   أخطاء GPS
================================ */

function onGPSerror(error){

    const messages = {

        1:
            "❌ لم يتم السماح بالموقع",

        2:
            "❌ تعذر الحصول على الموقع",

        3:
            "❌ انتهت مهلة GPS"

    };


    setStatus(
        messages[error.code] ||
        "❌ خطأ GPS"
    );

}


/* ================================
   البحث عن الوجهة
================================ */

async function searchDestination(){

    const input =
        document.getElementById(
            "destination"
        );


    const query =
        input.value.trim();


    if(!query){

        setStatus(
            "اكتب وجهة أولاً"
        );

        return;

    }


    setStatus(
        "🔎 جارٍ البحث عن الوجهة..."
    );


    try{

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search" +
                "?format=jsonv2" +
                "&limit=1" +
                "&q=" +
                encodeURIComponent(query)
            );


        const results =
            await response.json();


        if(
            !results ||
            results.length === 0
        ){

            setStatus(
                "❌ لم يتم العثور على المكان"
            );

            return;

        }


        const result =
            results[0];


        destination = {

            lat:
                Number(result.lat),

            lon:
                Number(result.lon),

            name:
                result.display_name

        };


        if(destinationMarker){

            destinationMarker.remove();

        }


        destinationMarker =
            L.marker(
                [
                    destination.lat,
                    destination.lon
                ]
            )
            .addTo(map)
            .bindPopup(
                "🏁 " +
                destination.name
            )
            .openPopup();


        map.setView(
            [
                destination.lat,
                destination.lon
            ],
            14
        );


        setStatus(
            "🏁 تم تحديد الوجهة"
        );


        if(userPos){

            await buildRoute();

        }

    }

    catch(error){

        console.error(error);

        setStatus(
            "❌ تعذر البحث عن الوجهة"
        );

    }

}


/* ================================
   حساب الطريق
================================ */

async function buildRoute(){

    if(
        !userPos ||
        !destination
    ){

        return;

    }


    setStatus(
        "🛣️ جارٍ حساب الطريق..."
    );


    try{

        const url =
            "https://router.project-osrm.org/route/v1/driving/" +

            userPos.lon +
            "," +
            userPos.lat +

            ";" +

            destination.lon +
            "," +
            destination.lat +

            "?overview=full" +
            "&geometries=geojson" +
            "&steps=true";


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(
            data.code !== "Ok" ||
            !data.routes ||
            !data.routes.length
        ){

            setStatus(
                "❌ لم يتم العثور على طريق"
            );

            return;

        }


        const route =
            data.routes[0];


        if(routeLine){

            routeLine.remove();

        }


        routeLine =
            L.geoJSON(
                route.geometry,
                {
                    style:{
                        weight:6,
                        opacity:.9
                    }
                }
            ).addTo(map);


        map.fitBounds(
            routeLine.getBounds(),
            {
                padding:[
                    40,
                    120
                ]
            }
        );


        showRouteStats(
            route
        );


        return route;

    }

    catch(error){

        console.error(error);

        setStatus(
            "❌ تعذر حساب الطريق"
        );

    }

}


/* ================================
   معلومات الطريق
================================ */

function showRouteStats(route){

    document.getElementById(
        "distance"
    ).textContent =
        km(route.distance);


    document.getElementById(
        "eta"
    ).textContent =
        formatTime(
            route.duration
        );

}


/* ================================
   بدء القيادة
================================ */

async function startNavigation(){

    if(!userPos){

        startGPS();

        setStatus(
            "📍 جارٍ تحديد موقعك..."
        );

        return;

    }


    if(!destination){

        const query =
            document
                .getElementById(
                    "destination"
                )
                .value
                .trim();


        if(query){

            await searchDestination();

        }

        else{

            setStatus(
                "🏁 حدد وجهة أولاً"
            );

            return;

        }

    }


    if(!destination){

        return;

    }


    navigating = true;


    await buildRoute();


    setStatus(
        "🚗 بدأت الملاحة — قد بحذر"
    );

}


/* ================================
   إيقاف القيادة
================================ */

function stopNavigation(){

    navigating = false;


    if(routeLine){

        routeLine.remove();

        routeLine = null;

    }


    document.getElementById(
        "distance"
    ).textContent = "--";


    document.getElementById(
        "eta"
    ).textContent = "--";


    setStatus(
        "⏹ تم إيقاف الملاحة"
    );

}


/* ================================
   تحديث الملاحة
================================ */

async function updateNavigation(){

    const now =
        Date.now();


    if(
        now - lastRoute <
        10000
    ){

        return;

    }


    lastRoute =
        now;


    await buildRoute();

}


/* ================================
   تشغيل GPS تلقائياً
================================ */

startGPS();

</script>

</body>
</html>
