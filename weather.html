<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الطقس الذكي</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            background-attachment: fixed; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            transition: background 0.8s ease;
        }
        body.cold-theme { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%); }
        body.hot-theme { background: linear-gradient(135deg, #450a0a 0%, #9a3412 50%, #b45309 100%); }
        .container { width: 100%; max-width: 420px; text-align: center; }
        .card {
            background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12); padding: 24px;
            border-radius: 24px; margin-bottom: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .city-comment {
            font-size: 15px; color: #38bdf8;
            background: rgba(56, 189, 248, 0.1); padding: 10px;
            border-radius: 12px; margin-bottom: 15px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .temp-display { font-size: 54px; font-weight: 800; margin: 15px 0; }
        .status-box { font-size: 16px; font-weight: 600; padding: 16px; border-radius: 16px; margin-top: 20px; line-height: 1.6; }
        .good { background: rgba(6, 95, 70, 0.6); border: 1px solid #10b981; color: #6ee7b7; }
        .bad { background: rgba(127, 29, 29, 0.6); border: 1px solid #ef4444; color: #fca5a5; }
        .neutral { background: rgba(202, 138, 4, 0.6); border: 1px solid #eab308; color: #fef08a; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .detail-item { background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 14px; font-size: 14px; }
        .detail-item span { display: block; font-weight: bold; font-size: 16px; margin-top: 5px; color: #38bdf8; }
        
        .action-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: white; border: none; padding: 16px 24px; font-size: 18px;
            font-weight: bold; border-radius: 16px; cursor: pointer; width: 100%;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4); transition: transform 0.2s ease;
        }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2 id="card-title">✨ الطقس الذكي</h2>
            
            <div id="start-section" style="padding: 20px 0;">
                <p style="color: #94a3b8; margin-bottom: 20px; font-size: 15px;">اضغط على الزر أدناه لمعرفة حالة الطقس والتقييم الذكي:</p>
                <button class="action-btn" onclick="getWeatherLocation()">معرفة حالة الطقس</button>
            </div>

            <div id="loading" style="display: none; font-size: 16px; color: #94a3b8; padding: 20px;">جاري رصد موقعك وجلب اسم المدينة...</div>
            
            <div id="weather-info" style="display: none;">
                <div id="city-comment" class="city-comment">جاري تحديد المدينة...</div>

                <div class="temp-display" id="temp">-°C</div>
                
                <!-- الأيقونة وحالة الجو الكبيرة -->
                <div id="condition-badge" style="display: inline-block; padding: 8px 16px; border-radius: 20px; font-size: 16px; font-weight: bold; margin-bottom: 15px; background: rgba(255,255,255,0.1);"></div>
                
                <div class="details-grid">
                    <div class="detail-item">
                        سرعة الرياح
                        <span id="wind">- كم/س</span>
                    </div>
                    <div class="detail-item">
                        حالة الوقت
                        <span id="time-status">-</span>
                    </div>
                </div>

                <div id="recommendation" class="status-box"></div>
            </div>
        </div>
    </div>

    <script>
        function getWeatherLocation() {
            document.getElementById('start-section').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    try {
                        const { latitude, longitude } = pos.coords;
                        
                        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=ar`);
                        const geoData = await geoRes.json();
                        const cityName = geoData.address.city || geoData.address.town || geoData.address.state || "مدينتك";

                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,wind_speed_10m,weather_code,is_day&timezone=auto`, {
                            cache: 'no-store'
                        });
                        const data = await res.json();
                        
                        const temp = data.current.temperature_2m;
                        const code = data.current.weather_code;
                        const isDay = data.current.is_day;
                        const windSpeed = data.current.wind_speed_10m;

                        // تعريف أوصاف الطقس والأيقونات الدقيقة
                        const weatherMap = {
                            0: { text: "مشمس ☀️", type: "clear" },
                            1: { text: "مشمس جزئياً 🌤️", type: "clear" },
                            2: { text: "غائم جزئياً ⛅", type: "cloudy" },
                            3: { text: "غائم ☁️", type: "cloudy" },
                            45: { text: "ضباب 🌫️", type: "fog" },
                            51: { text: "رذاذ خفيف 💧", type: "rain" },
                            61: { text: "ممطر 🌧️", type: "rain" },
                            63: { text: "ممطر 🌧️", type: "rain" },
                            65: { text: "مطر غزير 🌧️", type: "rain" },
                            95: { text: "عواصف رعدية ⚡", type: "storm" },
                            96: { text: "رعد ومطر ⛈️", type: "storm" }
                        };
                        
                        const currentWeather = weatherMap[code] || { text: "متغير ☁️", type: "cloudy" };

                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('weather-info').style.display = 'block';

                        document.getElementById('city-comment').innerHTML = `📍 أنت في <strong>${cityName}</strong>: الحرارة الحالية ${temp}°C`;

                        document.getElementById('temp').innerText = `${temp}°C`;
                        
                        // عرض أيقونة الحالة (مشمس، غائم، ممطر...)
                        const badge = document.getElementById('condition-badge');
                        badge.innerText = currentWeather.text;

                        document.getElementById('wind').innerText = `${windSpeed} كم/س`;
                        document.getElementById('time-status').innerText = isDay ? "نهار ☀️" : "ليل 🌙";

                        const bodyElement = document.body;
                        const recBox = document.getElementById('recommendation');

                        // التقييم الذكي يدمج حالة المطر والحرارة معاً بشكل منطقي
                        if (currentWeather.type === 'rain' || currentWeather.type === 'storm') {
                            bodyElement.className = "cold-theme";
                            recBox.className = "status-box bad";
                            recBox.innerHTML = `🌧️ <strong>الجو ممطر (${temp}°C)!</strong><br>حالة الطقس الحالية ${currentWeather.text}، يفضل عدم الخروج من المنزل والابتعاد عن البلل.`;
                        } else if (temp >= 20 && temp <= 28) {
                            bodyElement.className = "";
                            recBox.className = "status-box good";
                            recBox.innerHTML = `🌟 <strong>الجو مثالي ومريح (${temp}°C)!</strong><br>الجو رائع جداً وممتاز للأنشطة الخارجية والتنزه (${currentWeather.text}).`;
                        } else if (temp >= 15 && temp <= 19) {
                            bodyElement.className = "cold-theme";
                            recBox.className = "status-box neutral";
                            recBox.innerHTML = `🧥 <strong>الجو منعش ويميل للبرودة (${temp}°C)!</strong><br>الجو جميل ونشط، لكن قد تحتاج تلبس جاكيت خفيف أو هودي (${currentWeather.text}).`;
                        } else if (temp < 10) {
                            bodyElement.className = "cold-theme";
                            recBox.className = "status-box bad";
                            recBox.innerHTML = `❄️ <strong>برد قارس (${temp}°C)!</strong><br>ينصح بعدم الخروج من المنزل والتدفئة بشكل جيد.`;
                        } else if (temp > 35) {
                            bodyElement.className, bodyElement.className = "hot-theme";
                            recBox.className = "status-box bad";
                            recBox.innerHTML = `🔥 <strong>حرارة عالية (${temp}°C)!</strong><br>الجو حار جداً، والخروج يعرضك للإرهاق، يفضل البقاء في مكان مكيف.`;
                        } else {
                            bodyElement.className = "";
                            recBox.className = "status-box neutral";
                            recBox.innerHTML = `🌡️ <strong>الجو مقبول (${temp}°C)!</strong><br>الطقس معتدل نسبياً (${currentWeather.text})، يمكنك الخروج بحذر.`;
                        }

                    } catch (error) {
                        document.getElementById('loading').innerText = "حدث خطأ أثناء جلب بيانات الموقع أو الطقس.";
                    }
                }, () => {
                    document.getElementById('loading').innerText = "يرجى السماح للـ GPS بالعمل من إعدادات المتصفح.";
                });
            } else {
                document.getElementById('loading').innerText = "متصفحك لا يدعم تحديد الموقع.";
            }
        }
    </script>
</body>
</html>
