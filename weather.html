<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-user-scalable=no">
    <title>تتبع الموقع الجغرافي</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            width: min(700px, 92%);
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .card h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .status {
            text-align: center;
            margin-bottom: 0;
            font-weight: bold;
        }

        .location-box {
            display: flex;
            gap: 15px;
        }

        .location-box div {
            flex: 1;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
        }

        .location-box span {
            display: block;
            color: #94a3b8;
            font-size: 13px;
        }

        .location-box strong {
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>متابعة الموقع</h1>
        <div class="subtitle">ربط الجهاز وإرسال الإحداثيات</div>

        <!-- بطاقة بيانات الدخول -->
        <div class="card">
            <h2>بيانات المصادقة</h2>
            <input type="text" id="userId" placeholder="أدخل UserID الخاص بك">
            <input type="password" id="token" placeholder="أدخل Token الخاص بك">
            <button id="connectButton">بدء الاتصال والتتبع</button>
        </div>

        <!-- بطاقة الحالة -->
        <div class="card">
            <h2>حالة الاتصال</h2>
            <p class="status" id="status">🔴 غير متصل</p>
        </div>

        <!-- بطاقة الإحداثيات -->
        <div class="card">
            <h2>الإحداثيات الحالية</h2>
            <div class="location-box">
                <div>
                    <span>خط العرض (Latitude)</span>
                    <strong id="latitude">--</strong>
                </div>
                <div>
                    <span>خط الطول (Longitude)</span>
                    <strong id="longitude">--</strong>
                </div>
            </div>
            <p id="locationStatus" style="margin-top: 15px; color: #94a3b8; text-align: center;">في انتظار بدء الاتصال...</p>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://YOUR-BACKEND.onrender.com"; // ضع رابط السيرفر الخاص بك هنا

        const userIdInput = document.getElementById("userId");
        const tokenInput = document.getElementById("token");
        const connectButton = document.getElementById("connectButton");
        const statusElement = document.getElementById("status");
        const latitudeElement = document.getElementById("latitude");
        const longitudeElement = document.getElementById("longitude");
        const locationStatus = document.getElementById("locationStatus");

        let credentials = null;
        let locationTimer = null;

        connectButton.addEventListener("click", async () => {
            const userId = userIdInput.value.trim();
            const token = tokenInput.value.trim();

            if (!userId || !token) {
                statusElement.textContent = "❌ أدخل UserID و Token";
                return;
            }

            credentials = { userId, token };
            statusElement.textContent = "🔄 جارٍ الحصول على موقعك...";
            startLocationTracking();
        });

        function startLocationTracking() {
            if (!navigator.geolocation) {
                locationStatus.textContent = "❌ متصفحك لا يدعم تحديد الموقع";
                return;
            }

            navigator.geolocation.getCurrentPosition(sendLocation, handleLocationError, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 30000
            });

            if (locationTimer) {
                clearInterval(locationTimer);
            }

            locationTimer = setInterval(() => {
                navigator.geolocation.getCurrentPosition(sendLocation, handleLocationError, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 30000
                });
            }, 60000);
        }

        async function sendLocation(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            latitudeElement.textContent = lat.toFixed(6);
            longitudeElement.textContent = lon.toFixed(6);
            locationStatus.textContent = "📡 يتم إرسال موقعك للسيرفر...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/update-location`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        userId: credentials.userId,
                        token: credentials.token,
                        lat,
                        lon,
                        cityName: "موقعك الحالي"
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "حدث خطأ");
                }

                statusElement.textContent = "🟢 الجهاز متصل";
                locationStatus.textContent = "✅ تم تحديث موقعك بنجاح";

            } catch (error) {
                console.error(error);
                statusElement.textContent = "🔴 فشل الاتصال بالسيرفر";
                locationStatus.textContent = "❌ تعذر تحديث الموقع";
            }
        }

        function handleLocationError(error) {
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    locationStatus.textContent = "❌ لم تسمح للمتصفح بالوصول إلى موقعك";
                    break;
                case error.POSITION_UNAVAILABLE:
                    locationStatus.textContent = "❌ الموقع غير متوفر";
                    break;
                case error.TIMEOUT:
                    locationStatus.textContent = "⏱️ انتهت مهلة تحديد الموقع";
                    break;
                default:
                    locationStatus.textContent = "❌ حدث خطأ في تحديد الموقع";
            }
        }
    </script>
</body>
</html>
