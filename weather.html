<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع الطقس والمخاطر البيئية</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            width: min(700px, 92%);
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .alert-box {
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
            text-align: center;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-item {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
        }

        .info-item span {
            display: block;
            color: #94a3b8;
            font-size: 13px;
        }

        .info-item strong {
            display: block;
            margin-top: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مراقبة الطقس والمخاطر</h1>
        <div class="subtitle">تحديد الموقع، رصد الحرارة، والتحذيرات</div>

        <!-- صندوق التحذيرات الخطيرة -->
        <div id="dangerAlert" class="alert-box">
            ⚠️ تنبيه خطر: درجات الحرارة غير صالحة أو توجد موجة حر/برد شديدة!
        </div>

        <!-- بطاقة إدخال المدينة أو استخدام الـ GPS -->
        <div class="card">
            <h2>حدد موقعك</h2>
            <button id="gpsButton" style="background: #059669;">📍 استخدم موقعي الحالي (GPS)</button>
            <div style="text-align: center; margin: 10px 0; color: #94a3b8;">أو</div>
            <input type="text" id="cityNameInput" placeholder="أدخل اسم المدينة (مثلاً: Riyadh, Cairo)">
            <button id="searchButton">فحص الطقس للمدينة</button>
        </div>

        <!-- بطاقة معلومات الطقس -->
        <div class="card">
            <h2>حالة الطقس والبيئة</h2>
            <div class="info-grid">
                <div class="info-item">
                    <span>المدينة / الموقع</span>
                    <strong id="cityNameVal">--</strong>
                </div>
                <div class="info-item">
                    <span>درجة الحرارة</span>
                    <strong id="tempVal">--</strong>
                </div>
                <div class="info-item">
                    <span>حالة الجو</span>
                    <strong id="weatherVal">--</strong>
                </div>
                <div class="info-item">
                    <span>سرعة الرياح</span>
                    <strong id="windVal">--</strong>
                </div>
            </div>
            <p id="statusMsg" style="margin-top: 15px; color: #94a3b8; text-align: center;">في انتظار اختيار الموقع...</p>
        </div>
    </div>

    <script>
        const gpsButton = document.getElementById("gpsButton");
        const searchButton = document.getElementById("searchButton");
        const cityNameInput = document.getElementById("cityNameInput");
        
        const cityNameVal = document.getElementById("cityNameVal");
        const tempVal = document.getElementById("tempVal");
        const weatherVal = document.getElementById("weatherVal");
        const windVal = document.getElementById("windVal");
        const statusMsg = document.getElementById("statusMsg");
        const dangerAlert = document.getElementById("dangerAlert");

        // زر الـ GPS
        gpsButton.addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("متصفحك لا يدعم تحديد الموقع الجغرافي");
                return;
            }
            statusMsg.textContent = "📡 جاري طلب إذن الموقع وتحديده...";
            navigator.geolocation.getCurrentPosition(
                position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    fetchWeatherByCoords(lat, lon);
                },
                error => {
                    statusMsg.textContent = "❌ رفضت إذن تحديد الموقع أو حدث خطأ";
                },
                { enableHighAccuracy: true }
            );
        });

        // زر البحث بالاسم
        searchButton.addEventListener("click", () => {
            const city = cityNameInput.value.trim();
            if (!city) {
                alert("الرجاء إدخال اسم المدينة");
                return;
            }
            fetchWeatherByCity(city);
        });

        // جلب الطقس بالإحداثيات
        async function fetchWeatherByCoords(lat, lon) {
            try {
                statusMsg.textContent = "🔄 جاري جلب بيانات الطقس...";
                // استخدام API مجاني للطقس (Open-Meteo) لا يتطلب مفتاح تشغيل
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await res.json();
                
                if (data && data.current_weather) {
                    updateUI(data.current_weather.temperature, data.current_weather.windspeed, `إحداثيات: ${lat.toFixed(2)}, ${lon.toFixed(2)}`, data.current_weather.weathercode);
                } else {
                    statusMsg.textContent = "❌ تعذر جلب بيانات الطقس";
                }
            } catch (e) {
                statusMsg.textContent = "❌ خطأ في الاتصال بخدمة الطقس";
            }
        }

        // جلب الطقس باسم المدينة
        async function fetchWeatherByCity(cityName) {
            try {
                statusMsg.textContent = "🔄 جاري البحث عن المدينة...";
                // أولاً نحصل على إحداثيات المدينة من الاسم
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    statusMsg.textContent = "❌ لم يتم العثور على المدينة";
                    return;
                }

                const place = geoData.results[0];
                fetchWeatherByCoords(place.latitude, place.longitude);
                cityNameVal.textContent = `${place.name} (${place.country || ''})`;

            } catch (e) {
                statusMsg.textContent = "❌ خطأ في البحث عن المدينة";
            }
        }

        // تحديث الواجهة وفحص شروط الخطر (أقل من 10 أو أعلى من 40)
        function updateUI(temp, wind, locationName, weatherCode) {
            if (cityNameVal.textContent === "--" || cityNameVal.textContent.includes("إحداثيات")) {
                cityNameVal.textContent = locationName;
            }
            tempVal.textContent = `${temp} °C`;
            windVal.textContent = `${wind} كم/س`;
            weatherVal.textContent = getWeatherDescription(weatherCode);
            statusMsg.textContent = "✅ تم تحديث بيانات الطقس بنجاح";

            // فحص تنبيهات الخطر (أقل من 10 أو أعلى من 40)
            if (temp > 40) {
                dangerAlert.style.display = "block";
                dangerAlert.textContent = `🔥 تحذير خطير: درجات الحرارة مرتفعة جداً (${temp}°C)! احذر من موجات الحر أو خطر الحرائق.`;
            } else if (temp < 10) {
                dangerAlert.style.display = "block";
                dangerAlert.textContent = `❄️ تحذير خطر: درجات الحرارة منخفضة جداً (${temp}°C)! موجة برد قارس.`;
            } else {
                dangerAlert.style.display = "none";
            }
        }

        // وصف حالة الطقس بناءً على كود الأقمار
        function getWeatherDescription(code) {
            if (code === 0) return "☀️ صحو / صافٍ";
            if (code >= 1 && code <= 3) return "⛅ غائم جزئياً";
            if (code >= 51 && code <= 67) return "🌧️ أمطار";
            if (code >= 95) return "⛈️ عواصف رعدية";
            return "☁️ غائم / متقلب";
        }
    </script>
</body>
</html>
