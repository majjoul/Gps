<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الطقس البسيط</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; padding-bottom: 70px; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 500px; margin: 20px auto; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; }
        button { background: #2563eb; border: none; font-weight: bold; cursor: pointer; }
        .section { display: none; }
        .section.active { display: block; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; display: none; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; }
        .nav button { background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; width: auto; margin: 0; }
        .nav button.active { color: #2563eb; }
    </style>
</head>
<body>

    <!-- 1. تسجيل البيانات -->
    <div id="loginSec" class="section active box">
        <h2>تسجيل البيانات للبدء</h2>
        <input type="text" id="name" placeholder="الاسم">
        <input type="text" id="city" placeholder="المدينة">
        <input type="text" id="country" placeholder="الدولة">
        <input type="number" id="age" placeholder="العمر">
        <button onclick="login()">دخول</button>
    </div>

    <!-- 2. الطقس -->
    <div id="weatherSec" class="section box">
        <h2>حالة الطقس</h2>
        <button onclick="getGPS()" style="background: #059669;">📍 حدد موقعي (GPS)</button>
        <p id="weatherResult">اضغط الزر لجلب الطقس...</p>
    </div>

    <!-- 3. الأخبار -->
    <div id="newsSec" class="section box">
        <h2>الأخبار</h2>
        <p id="newsResult">لا توجد أخبار حالياً، انتظر تحديث الطقس.</p>
    </div>

    <!-- الشريط السفلي -->
    <div id="navBar" class="nav">
        <button id="navW" class="active" onclick="switchTab('weatherSec', 'navW')">الطقس</button>
        <button id="navN" onclick="switchTab('newsSec', 'navN')">الأخبار</button>
    </div>

    <script>
        function login() {
            const n = document.getElementById("name").value;
            const c = document.getElementById("city").value;
            const co = document.getElementById("country").value;
            const a = document.getElementById("age").value;

            if(!n || !c || !co || !a) {
                alert("عبي كل الحقول أولاً!");
                return;
            }

            // إخفاء التسجيل وإظهار التطبيق والشريط السفلي
            document.getElementById("loginSec").classList.remove("active");
            document.getElementById("weatherSec").classList.add("active");
            document.getElementById("navBar").style.display = "flex";
        }

        function switchTab(secId, btnId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(secId).classList.add('active');
            document.getElementById(btnId).classList.add('active');
        }

        function getGPS() {
            if (!navigator.geolocation) {
                alert("المتصفح لا يدعم الـ GPS");
                return;
            }
            document.getElementById("weatherResult").innerText = "جاري تحديد الموقع...";
            navigator.geolocation.getCurrentPosition(pos => {
                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;
                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                .then(res => res.json())
                .then(data => {
                    let temp = data.current_weather.temperature;
                    document.getElementById("weatherResult").innerText = `درجة الحرارة الآن: ${temp} °C`;
                    
                    if(temp > 40) {
                        document.getElementById("newsResult").innerText = "🔥 تحذير: حرارة عالية جداً وموجة حر خطيرة!";
                    } else {
                        document.getElementById("newsResult").innerText = "الأجواء مستقرة ولا توجد مخاطر حالياً.";
                    }
                });
            }, () => {
                document.getElementById("weatherResult").innerText = "فشل تحديد الموقع.";
            });
        }
    </script>
</body>
</html>
